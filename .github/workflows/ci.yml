name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: command -v rg || (sudo apt-get update -q && sudo apt-get install -y -q ripgrep)
      - run: bash .github/pruefen.sh
      - run: npm ci --ignore-scripts
        working-directory: plugin
      - run: npx tsc --noEmit -p .
        working-directory: plugin
      - run: node --test "pruefffaelle/PF*.ts"
        working-directory: plugin
  apps:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: aenderung
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q -e '^apps/' -e '^\.github/'; then echo bauen=1 >> "$GITHUB_OUTPUT"; fi
      - if: steps.aenderung.outputs.bauen == '1'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - if: steps.aenderung.outputs.bauen == '1'
        run: xcodebuild -project apps/Mac/SenecaNativ.xcodeproj -scheme SenecaNativ -configuration Release ARCHS=arm64 -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -quiet build
      - if: steps.aenderung.outputs.bauen == '1'
        run: xcodebuild -project apps/iPhone/SenecaPocket.xcodeproj -scheme SenecaPocket -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -quiet build
